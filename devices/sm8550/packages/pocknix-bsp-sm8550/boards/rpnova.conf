# /usr/lib/pocknix/boards/rpnova.conf — runtime board facts: Retroid Pocket Nova.
# Selected by /usr/lib/pocknix/device.conf (DT model "Retroid Pocket Nova").
POCKNIX_DEVICE=rpnova
POCKNIX_SOC=sm8550

# Panel: il97680a, native 1280x960@120 landscape, no DT rotation: W/H are NOT transposed.
POCKNIX_PANEL_W=1280
POCKNIX_PANEL_H=960
POCKNIX_PANEL_REFRESH=120
POCKNIX_PANEL_ORIENT=normal      # gamescope --force-orientation
POCKNIX_PANEL_MM=177x100         # fake: ~184dpi keeps gamepadui at its designed 1280-wide layout
POCKNIX_DESKTOP_ROTATE=none      # kscreen-doctor rotation token
POCKNIX_DESKTOP_SCALE=2.0        # 640x480 logical: the Plasma Mobile shell needs the height

POCKNIX_BIG_CORES=3-7

# --- install-to-internal contract (qcom-abl) -----------------------------------
POCKNIX_INTERNAL_DISK=/dev/sda
POCKNIX_BOOT_GPT_NAME=POCKNIX
POCKNIX_BOOT_FAT_LABEL=POCKNIX
POCKNIX_ROOT_LABEL=POCKNIX_ROOT
